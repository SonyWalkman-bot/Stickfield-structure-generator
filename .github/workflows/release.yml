# When a release is published on GitHub (Releases → Draft a new release → choose a tag such as v1.0.0 → Publish), this
# builds the tool and attaches Weavefield.html and Weavefield.zip to it, so anyone can download the latest from
#   https://github.com/<owner>/<repo>/releases/latest/download/Weavefield.html
# Pushing a v* tag does the same.
name: Release
on:
  release:
    types: [published]
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - name: Attach the tool to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Weavefield.html dist/Weavefield.zip --clobber
          else
            gh release create "$TAG" dist/Weavefield.html dist/Weavefield.zip --title "Weavefield $TAG" \
              --notes "Download **Weavefield.html** and double-click it: it runs offline in any modern browser (Chrome, Edge, Firefox or Safari) on Windows, macOS, Linux or ChromeOS. **Weavefield.zip** has the same file with a README and the licences."
          fi
